<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Rifas Valle del Carrizo</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .contenedor {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }

    h1 {
      text-align: center;
      color: #176b35;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .boton-verde {
      background: #16833b;
      color: white;
    }

    .boton-rojo {
      background: #c62828;
      color: white;
    }

    .boton-gris {
      background: #555;
      color: white;
    }

    #panel {
      display: none;
    }

    .contadores {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }

    .contador {
      flex: 1;
      min-width: 120px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      background: #eee;
    }

    .contador strong {
      display: block;
      font-size: 25px;
    }

    .disponibles {
      color: #16833b;
    }

    .vendidos {
      color: #c62828;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 8px;
      margin-top: 20px;
    }

    .numero {
      min-height: 55px;
      background: #16833b;
      color: white;
      font-size: 15px;
    }

    .numero.vendido {
      background: #c62828;
    }

    .numero.seleccionado {
      outline: 4px solid #ffb300;
      outline-offset: 2px;
    }

    .acciones {
      margin: 20px 0;
      padding: 15px;
      background: #fff8e1;
      border-radius: 8px;
    }

    #mensaje {
      margin-top: 12px;
      font-weight: bold;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Rifas Valle del Carrizo</h1>
  <h2>Panel de Administración</h2>

  <section id="login">
    <h3>Acceso de administrador</h3>

    <input
      type="email"
      id="email"
      value="valledelcarrizosinaloa@gmail.com"
      placeholder="Correo electrónico"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <button class="boton-verde" onclick="iniciarSesion()">
      Entrar
    </button>

    <p id="mensajeLogin"></p>
  </section>

  <section id="panel">

    <p>Bienvenido al panel de administración.</p>

    <button class="boton-verde" onclick="cargarNumeros()">
      Actualizar boletos
    </button>

    <button class="boton-gris" onclick="cerrarSesion()">
      Cerrar sesión
    </button>

    <div class="contadores">

      <div class="contador">
        <strong id="total">110</strong>
        Total de boletos
      </div>

      <div class="contador">
        <strong id="disponibles" class="disponibles">0</strong>
        Disponibles
      </div>

      <div class="contador">
        <strong id="vendidos" class="vendidos">0</strong>
        Vendidos
      </div>

    </div>

    <div class="acciones">

      <h3>Cancelar una venta</h3>

      <p>
        Selecciona un boleto vendido para devolverlo a disponible.
      </p>

      <p id="seleccion">
        Ningún boleto seleccionado.
      </p>

      <button
        id="botonCancelar"
        class="boton-rojo"
        onclick="cancelarVenta()"
        disabled
      >
        Cancelar venta y liberar boleto
      </button>

      <p id="mensaje"></p>

    </div>

    <h3>Estado de los boletos</h3>

    <div id="numeros" class="grid"></div>

  </section>

</div>

<script>
const SUPABASE_URL = "https://kptejintrxbepdueoryd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hkytZdrjhkHUFkqC0u22A_Pjr68fOo";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const RAFFLE_SLUG = "primera-rifa-1000";

let usuarioAdministrador = null;
let boletoSeleccionado = null;
let boletosAdmin = [];

async function iniciarSesion() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const mensaje = document.getElementById("mensajeLogin");
  mensaje.textContent = "Verificando acceso...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    mensaje.textContent = "Error de acceso: " + error.message;
    return;
  }

  const autorizado = await verificarAdministrador();

  if (!autorizado) {
    await supabaseClient.auth.signOut();
    mensaje.textContent = "No tienes permisos de administrador.";
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("panel").style.display = "block";

  await cargarNumeros();
}

async function verificarAdministrador() {

  const { data: { user }, error: errorSesion } =
    await supabaseClient.auth.getUser();

  if (errorSesion || !user) {
    usuarioAdministrador = null;
    return false;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("role, active")
    .eq("id", user.id)
    .single();

  if (error || !data || data.role !== "admin" || data.active !== true) {
    usuarioAdministrador = null;
    return false;
  }

  usuarioAdministrador = user;
  return true;
}

async function cargarNumeros() {

  const autorizado = await verificarAdministrador();

  if (!autorizado) {
    alert("Tu sesión no está autorizada. Inicia sesión nuevamente.");
    await cerrarSesion();
    return;
  }

  const contenedor = document.getElementById("numeros");
  const mensaje = document.getElementById("mensaje");

  contenedor.innerHTML = "Cargando boletos...";
  mensaje.textContent = "";

  boletoSeleccionado = null;
  actualizarSeleccion();

  const { data: rifa, error: errorRifa } = await supabaseClient
    .from("raffles")
    .select("id")
    .eq("slug", RAFFLE_SLUG)
    .single();

  if (errorRifa || !rifa) {
    contenedor.innerHTML = "No se pudo encontrar la rifa.";
    mensaje.textContent = errorRifa?.message || "";
    return;
  }

  const { data: boletos, error } = await supabaseClient
    .from("tickets")
    .select("id, raffle_id, ticket_number, status")
    .eq("raffle_id", rifa.id)
    .order("ticket_number", { ascending: true });

  if (error) {
    contenedor.innerHTML = "Error al cargar boletos.";
    mensaje.textContent = error.message;
    return;
  }

  boletosAdmin = boletos || [];

  contenedor.innerHTML = "";

  let disponibles = 0;
  let vendidos = 0;

  boletosAdmin.forEach(boleto => {

    const numero = String(boleto.ticket_number).padStart(3, "0");

    const boton = document.createElement("button");

    boton.className = "numero";

    if (boleto.status === "sold") {
      boton.classList.add("vendido");
      boton.textContent = numero + "\nVENDIDO";
      vendidos++;

      boton.onclick = () => seleccionarBoleto(boleto.id);

    } else {
      boton.textContent = numero + "\nLIBRE";
      disponibles++;
    }

    boton.dataset.id = boleto.id;

    contenedor.appendChild(boton);

  });

  document.getElementById("total").textContent = boletosAdmin.length;
  document.getElementById("disponibles").textContent = disponibles;
  document.getElementById("vendidos").textContent = vendidos;
}

function seleccionarBoleto(id) {

  boletoSeleccionado = boletosAdmin.find(
    boleto => boleto.id === id
  );

  document.querySelectorAll(".numero").forEach(boton => {
    boton.classList.remove("seleccionado");
  });

  const boton = document.querySelector(
    '.numero[data-id="' + id + '"]'
  );

  if (boton) {
    boton.classList.add("seleccionado");
  }

  actualizarSeleccion();
}

function actualizarSeleccion() {

  const texto = document.getElementById("seleccion");
  const botonCancelar = document.getElementById("botonCancelar");

  if (!boletoSeleccionado) {
    texto.textContent = "Ningún boleto seleccionado.";
    botonCancelar.disabled = true;
    return;
  }

  const numero = String(
    boletoSeleccionado.ticket_number
  ).padStart(3, "0");

  texto.textContent = "Boleto seleccionado: " + numero;
  botonCancelar.disabled = false;
}

async function cancelarVenta() {

  if (!boletoSeleccionado) {
    alert("Primero selecciona un boleto vendido.");
    return;
  }

  const autorizado = await verificarAdministrador();

  if (!autorizado) {
    alert("Tu sesión ya no está autorizada.");
    await cerrarSesion();
    return;
  }

  const numero = String(
    boletoSeleccionado.ticket_number
  ).padStart(3, "0");

  const confirmar = confirm(
    "¿Confirmas cancelar la venta del boleto " +
    numero +
    " y devolverlo a DISPONIBLE?"
  );

  if (!confirmar) return;

  const mensaje = document.getElementById("mensaje");

  mensaje.textContent = "Procesando cancelación...";

  const id = boletoSeleccionado.id;

  const { data, error } = await supabaseClient
    .from("tickets")
    .update({ status: "available" })
    .eq("id", id)
    .eq("status", "sold")
    .select("id");

  if (error) {
    mensaje.textContent = "No se pudo cancelar: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    mensaje.textContent =
      "El boleto ya no está vendido. Actualiza la lista.";
    boletoSeleccionado = null;
    actualizarSeleccion();
    return;
  }

  boletoSeleccionado = null;

  mensaje.textContent =
    "El boleto " + numero + " ahora está DISPONIBLE.";

  await cargarNumeros();
}

async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  usuarioAdministrador = null;
  boletoSeleccionado = null;
  boletosAdmin = [];

  document.getElementById("panel").style.display = "none";
  document.getElementById("login").style.display = "block";

  document.getElementById("password").value = "";
}

async function revisarSesion() {

  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (!session) return;

  const autorizado = await verificarAdministrador();

  if (autorizado) {
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
    await cargarNumeros();
  } else {
    await supabaseClient.auth.signOut();
  }
}

revisarSesion();
</script>

</body>
</html>
